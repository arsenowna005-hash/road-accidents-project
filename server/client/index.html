<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг ДТП</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 800px; margin: 0 auto 20px; }
        h1 { color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #2e75b6; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px;}
        button:hover { background-color: #1f4e79; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px;}
        th { background-color: #f2f2f2; }
        .error { color: red; font-weight: bold; margin-top: 10px; }
        .success { color: green; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Добавить новое ДТП</h1>
        <form id="accidentForm">
            <div class="form-group">
                <label>Место (Location):</label>
                <input type="text" id="location" required placeholder="напр. Бишкек, ул. Ленина">
            </div>
            <div class="form-group">
                <label>Дата:</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label>Тип ДТП:</label>
                <select id="type">
                    <option value="Столкновение">Столкновение</option>
                    <option value="Наезд на пешехода">Наезд на пешехода</option>
                    <option value="Опрокидывание">Опрокидывание</option>
                </select>
            </div>
            <div class="form-group">
                <label>Погода:</label>
                <input type="text" id="weather" placeholder="напр. Дождь, Ясно">
            </div>
            <button type="submit">Сохранить ДТП</button>
            <div id="message"></div>
        </form>
    </div>

    <div class="card">
        <h1>Список ДТП</h1>
        <button onclick="loadAccidents()">Обновить список</button>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Место</th>
                    <th>Дата</th>
                    <th>Тип</th>
                    <th>Погода</th>
                </tr>
            </thead>
            <tbody id="accidentsTable">
                <!-- Сюда будут загружаться данные -->
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api/v1/accidents';

        // 1. Функция загрузки списка (GET)
        async function loadAccidents() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                
                const tbody = document.getElementById('accidentsTable');
                tbody.innerHTML = ''; // Очищаем таблицу

                result.data.forEach(acc => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${acc.id}</td>
                        <td>${acc.location}</td>
                        <td>${acc.date}</td>
                        <td>${acc.type}</td>
                        <td>${acc.weather}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Ошибка загрузки:", error);
            }
        }

        // 2. Обработчик отправки формы (POST)
        document.getElementById('accidentForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Отменяем перезагрузку страницы

            const newAccident = {
                location: document.getElementById('location').value,
                date: document.getElementById('date').value,
                type: document.getElementById('type').value,
                weather: document.getElementById('weather').value
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newAccident)
                });

                const msgDiv = document.getElementById('message');

                if (response.ok) {
                    msgDiv.className = 'success';
                    msgDiv.textContent = 'ДТП успешно добавлено!';
                    document.getElementById('accidentForm').reset();
                    loadAccidents(); // Обновляем таблицу
                } else {
                    const err = await response.json();
                    msgDiv.className = 'error';
                    msgDiv.textContent = 'Ошибка: ' + err.error.message;
                }
            } catch (error) {
                console.error("Ошибка отправки:", error);
            }
        });

        // Загружаем данные при открытии страницы
        loadAccidents();
    </script>
</body>
</html>
