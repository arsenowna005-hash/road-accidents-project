<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг ДТП (Лаб. 3)</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 900px; margin: 0 auto 20px; }
        h1 { color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #2e75b6; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-top: 10px;}
        button:hover { background-color: #1f4e79; }
        .btn-delete { background-color: #dc3545; padding: 5px 10px; font-size: 12px; margin: 0; }
        .btn-delete:hover { background-color: #c82333; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px;}
        th { background-color: #f2f2f2; }
        .error { color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; padding: 10px; border-radius: 4px; margin-top: 10px; font-weight: bold;}
        .success { color: #155724; background-color: #d4edda; border: 1px solid #c3e6cb; padding: 10px; border-radius: 4px; margin-top: 10px; font-weight: bold;}
        #searchInput { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #2e75b6; border-radius: 4px; font-size: 16px; box-sizing: border-box;}
        .spinner { display: none; text-align: center; color: #2e75b6; font-weight: bold; margin-top: 15px; padding: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Добавить новое ДТП</h1>
        <form id="accidentForm">
            <div class="form-group">
                <label>Место (Location):</label>
                <input type="text" id="location" required placeholder="напр. Бишкек, ул. Ленина">
            </div>
            <div class="form-group">
                <label>Дата:</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label>Тип ДТП:</label>
                <select id="type">
                    <option value="Столкновение">Столкновение</option>
                    <option value="Наезд на пешехода">Наезд на пешехода</option>
                    <option value="Опрокидывание">Опрокидывание</option>
                </select>
            </div>
            <div class="form-group">
                <label>Погода:</label>
                <input type="text" id="weather" placeholder="напр. Дождь, Ясно">
            </div>
            <button type="submit">Сохранить ДТП</button>
            <div id="message"></div>
        </form>
    </div>

    <div class="card">
        <h1>Список ДТП</h1>
        
        <!-- Поле для живого поиска -->
        <input type="text" id="searchInput" placeholder="🔍 Поиск по месту (например, Киевская)...">
        
        <button onclick="loadAccidents()">Обновить список</button>

        <!-- Спиннер загрузки (Лаб 3) -->
        <div id="loadingSpinner" class="spinner">⏳ Загрузка данных с сервера...</div>
        
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Место</th>
                    <th>Дата</th>
                    <th>Тип</th>
                    <th>Погода</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="accidentsTable">
                <!-- Данные загрузятся скриптом -->
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api/v1/accidents';
        let allAccidents = []; // Храним все данные для поиска

        // 1. Функция загрузки списка (GET) с показом спиннера
        async function loadAccidents() {
            const spinner = document.getElementById('loadingSpinner');
            spinner.style.display = 'block'; // Показываем спиннер

            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                allAccidents = result.data; 
                renderTable(allAccidents); 
            } catch (error) {
                console.error("Ошибка загрузки:", error);
            } finally {
                spinner.style.display = 'none'; // Прячем спиннер в любом случае
            }
        }

        // 2. Функция отрисовки таблицы
        function renderTable(accidentsToRender) {
            const tbody = document.getElementById('accidentsTable');
            tbody.innerHTML = ''; 

            if (accidentsToRender.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Ничего не найдено</td></tr>';
                return;
            }

            accidentsToRender.forEach(acc => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${acc.id}</td>
                    <td>${acc.location}</td>
                    <td>${acc.date}</td>
                    <td>${acc.type}</td>
                    <td>${acc.weather || '-'}</td>
                    <td><button class="btn-delete" onclick="deleteAccident('${acc.id}')">Удалить</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 3. Обработчик отправки формы (POST) с валидацией
        document.getElementById('accidentForm').addEventListener('submit', async (e) => {
            e.preventDefault(); 

            const locationValue = document.getElementById('location').value.trim();
            const msgDiv = document.getElementById('message');

            // ВАЛИДАЦИЯ (Лаб 3): Место должно быть не короче 5 символов
            if (locationValue.length < 5) {
                msgDiv.className = 'error';
                msgDiv.textContent = 'Ошибка: Место ДТП должно содержать минимум 5 символов!';
                return; // Останавливаем отправку запроса
            }

            const newAccident = {
                location: locationValue,
                date: document.getElementById('date').value,
                type: document.getElementById('type').value,
                weather: document.getElementById('weather').value
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newAccident)
                });

                if (response.ok) {
                    msgDiv.className = 'success';
                    msgDiv.textContent = 'ДТП успешно добавлено!';
                    document.getElementById('accidentForm').reset();
                    loadAccidents(); 
                } else {
                    const err = await response.json();
                    msgDiv.className = 'error';
                    msgDiv.textContent = 'Ошибка сервера: ' + err.error.message;
                }
            } catch (error) {
                console.error("Ошибка отправки:", error);
                msgDiv.className = 'error';
                msgDiv.textContent = 'Ошибка сети. Проверьте подключение к серверу.';
            }
        });

        // 4. Функция удаления (DELETE)
        async function deleteAccident(id) {
            if (!confirm(`Вы уверены, что хотите удалить ДТП с ID ${id}?`)) return;

            try {
                const response = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    loadAccidents(); // Обновляем таблицу после удаления
                } else {
                    alert('Ошибка при удалении ДТП');
                }
            } catch (error) {
                console.error("Ошибка удаления:", error);
            }
        }

        // 5. Обработчик живого поиска
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allAccidents.filter(acc => 
                acc.location.toLowerCase().includes(query)
            );
            renderTable(filtered);
        });

        // Загружаем данные при открытии страницы
        loadAccidents();
    </script>
</body>
</html>
